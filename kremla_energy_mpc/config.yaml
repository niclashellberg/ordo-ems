name: Kremla Energy MPC
description: Battery + EV MPC optimizer for Home Assistant (SE3 Nord Pool)
version: "0.1.4"
slug: kremla_energy_mpc
url: https://github.com/niclashellberg/ordo-ems/tree/main/kremla_energy_mpc
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8765
panel_icon: mdi:solar-power
homeassistant: "2024.1.0"
options:
  homeassistant_url: "http://supervisor/core"
  nordpool_entity: "sensor.nord_pool_se3_prices"
  model_bundle_url: ""
  loop_interval_minutes: 15
  anthropic_api_key: ""
schema:
  homeassistant_url: str
  nordpool_entity: str
  model_bundle_url: str?
  loop_interval_minutes: int(5,60)?
  anthropic_api_key: password?
map:
  - config:rw
  - data:rw
ports:
  8765/tcp: 8765
environment:
  CONFIG_PATH: /data/options.yaml
  API_PORT: "8765"
