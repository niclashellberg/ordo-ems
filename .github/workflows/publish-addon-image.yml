# Builds the add-on image on GitHub (fast) and publishes to GHCR.
# After this workflow succeeds, set the package public:
#   GitHub → Packages → kremla-energy-mpc → Package settings → Public
name: Publish add-on image

on:
  push:
    branches: [main]
    paths:
      - "kremla_energy_mpc/**"
      - ".github/workflows/publish-addon-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read add-on version
        id: ver
        run: |
          v=$(grep '^version:' kremla_energy_mpc/config.yaml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ./kremla_energy_mpc
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/niclashellberg/kremla-energy-mpc:${{ steps.ver.outputs.version }}
            ghcr.io/niclashellberg/kremla-energy-mpc:latest
