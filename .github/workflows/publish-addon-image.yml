# Optional: publish pre-built image to GHCR (must be set Public in GitHub Packages).
name: Publish add-on image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ver
        run: echo "version=$(grep '^version:' kremla_energy_mpc/config.yaml | sed 's/.*\"\(.*\)\".*/\1/')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./kremla_energy_mpc
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/niclashellberg/kremla-energy-mpc:${{ steps.ver.outputs.version }}
            ghcr.io/niclashellberg/kremla-energy-mpc:latest
