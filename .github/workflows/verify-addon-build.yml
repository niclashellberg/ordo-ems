name: Verify add-on Docker build

on:
  push:
    branches: [main]
    paths:
      - "kremla_energy_mpc/**"
  pull_request:
    paths:
      - "kremla_energy_mpc/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject symlinks in addon config
        run: |
          if [ -L kremla_energy_mpc/config/example.yaml ]; then
            echo "example.yaml must not be a symlink"
            exit 1
          fi
          test "$(wc -c < kremla_energy_mpc/config/example.yaml)" -gt 200

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./kremla_energy_mpc
          platforms: linux/arm64
          push: false
          tags: kremla-energy-mpc:test
